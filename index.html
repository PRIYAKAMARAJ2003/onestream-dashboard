<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="refresh" content="60">
<title>OneStream Report Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#080c14;--surface:#0d1422;--card:#111827;--card-hover:#151f30;
    --border:rgba(99,179,237,0.12);--border-hi:rgba(99,179,237,0.35);
    --accent:#38bdf8;--accent2:#818cf8;--accent3:#34d399;
    --text:#e2e8f0;--muted:#64748b;--overlay:rgba(4,8,16,0.92);
    --glow:0 0 40px rgba(56,189,248,0.08);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4;}
  header{position:sticky;top:0;z-index:100;background:rgba(8,12,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;}
  .header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:2rem;height:64px;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-0.02em;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:.6rem;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.7;}}
  .header-stats{margin-left:auto;display:flex;gap:1.5rem;align-items:center;}
  .stat-pill{font-size:.72rem;font-weight:500;padding:.3rem .8rem;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,0.03);}
  .stat-pill span{color:var(--accent);}
  .last-updated{font-size:.7rem;color:var(--muted);letter-spacing:.03em;}
  .last-updated span{color:var(--accent3);}
  .main{max-width:1600px;margin:0 auto;padding:2rem;position:relative;z-index:1;}
  .hero{padding:2.5rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:2rem;}
  .hero h1{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:800;letter-spacing:-0.04em;line-height:1.1;background:linear-gradient(135deg,#e2e8f0 0%,var(--accent) 50%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
  .hero p{color:var(--muted);font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;}
  .controls{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem;}
  .search-wrap{position:relative;flex:1;min-width:260px;max-width:480px;}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.9rem;}
  .search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem .75rem 2.6rem;color:var(--text);font-family:'DM Mono',monospace;font-size:.85rem;outline:none;transition:border-color .2s,box-shadow .2s;}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12);}
  .search-input::placeholder{color:var(--muted);}
  .filter-group{display:flex;gap:.6rem;flex-wrap:wrap;}
  .filter-btn{padding:.5rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Mono',monospace;font-size:.78rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
  .filter-btn:hover{border-color:var(--border-hi);color:var(--text);}
  .filter-btn.active{background:rgba(56,189,248,.12);border-color:var(--accent);color:var(--accent);}
  .select-filter{padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'DM Mono',monospace;font-size:.78rem;cursor:pointer;outline:none;transition:border-color .2s;max-width:260px;}
  .select-filter:focus{border-color:var(--accent);}
  .select-filter option{background:var(--surface);}
  .result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;}
  .result-count{font-size:.78rem;color:var(--muted);letter-spacing:.05em;}
  .result-count span{color:var(--accent);font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.4rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;animation:fadeUp .4s ease both;}
  .card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(56,189,248,.04) 0%,transparent 60%);pointer-events:none;}
  .card:hover{transform:translateY(-3px);border-color:var(--border-hi);box-shadow:var(--glow),0 8px 32px rgba(0,0,0,.4);background:var(--card-hover);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;margin-bottom:.9rem;}
  .card-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.92rem;color:var(--accent);letter-spacing:-.01em;line-height:1.3;word-break:break-word;}
  .type-badge{font-size:.65rem;font-weight:500;padding:.25rem .6rem;border-radius:6px;white-space:nowrap;flex-shrink:0;letter-spacing:.04em;text-transform:uppercase;}
  .type-report{background:rgba(52,211,153,.1);color:#6ee7b7;border:1px solid rgba(52,211,153,.2);}
  .type-blended{background:rgba(129,140,248,.1);color:#a5b4fc;border:1px solid rgba(129,140,248,.2);}
  .type-fdx{background:rgba(251,191,36,.1);color:#fcd34d;border:1px solid rgba(251,191,36,.2);}
  .card-desc{font-size:.8rem;color:#94a3b8;line-height:1.55;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;flex-direction:column;gap:.4rem;}
  .meta-row{display:flex;align-items:flex-start;gap:.5rem;font-size:.73rem;}
  .meta-label{color:var(--muted);min-width:60px;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em;font-size:.65rem;margin-top:1px;}
  .meta-value{color:#cbd5e1;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .card-footer{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .view-btn{font-size:.72rem;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:.3rem;transition:gap .2s;}
  .card:hover .view-btn{gap:.5rem;}
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(12px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--surface);border:1px solid var(--border-hi);border-radius:18px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:2rem;position:relative;box-shadow:0 0 80px rgba(56,189,248,.08),0 32px 64px rgba(0,0,0,.6);transform:scale(.96) translateY(12px);transition:transform .25s ease;}
  .modal-overlay.open .modal{transform:scale(1) translateY(0);}
  .modal-close{position:absolute;top:1.2rem;right:1.2rem;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;}
  .modal-close:hover{color:var(--text);border-color:var(--border-hi);}
  .modal-badge-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
  .modal-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;color:var(--accent);letter-spacing:-.02em;line-height:1.25;margin-bottom:.5rem;padding-right:2.5rem;}
  .modal-subtitle{color:#94a3b8;font-size:.82rem;line-height:1.6;margin-bottom:1.5rem;}
  .modal-fields{display:flex;flex-direction:column;gap:.1rem;}
  .field-row{display:grid;grid-template-columns:200px 1fr;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--border);align-items:start;}
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding-top:2px;}
  .field-value{font-size:.83rem;color:var(--text);line-height:1.6;white-space:pre-wrap;}
  .field-value.empty{color:var(--muted);font-style:italic;}
  .empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--muted);}
  .empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.3;}
  .empty h3{font-family:'Syne',sans-serif;font-size:1.2rem;color:#475569;margin-bottom:.4rem;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:#334155;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-dot"></div>OneStream Report Inventory</div>
    <div class="header-stats">

</header>
<main class="main">

    <select class="select-filter" id="locationFilter">

    </select>
  </div>
  <div class="result-bar">
    <div class="result-count"><span id="resultCount">0</span> reports found</div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&#10005;</button>

    <div class="modal-title" id="modalName"></div>
    <div class="modal-subtitle" id="modalDesc"></div>
    <div class="modal-fields" id="modalFields"></div>

</div>

const LAST_UPDATED = "May 19, 2026 06:49";

// ── BUILD LOCATION DROPDOWN DYNAMICALLY ──
const locations = [...new Set(REPORTS.map(r => r.location.trim()).filter(Boolean))].sort();
const locSel = document.getElementById('locationFilter');
locations.forEach(loc => {
  const opt = document.createElement('option');
  opt.value = loc; opt.textContent = loc;
  locSel.appendChild(opt);
});

// ── SET LAST UPDATED ──
document.getElementById('lastUpdated').textContent = LAST_UPDATED;

// ── STATE ──
let filtered=[...REPORTS],searchQ='',activeType='all',activeLocation='';

function typeClass(t){
  if(t==='Blended Report') return 'type-blended';
  if(t==='FDX Report') return 'type-fdx';
  return 'type-report';
}
function highlight(text, q) {	

  if (!q) return escHtml(text);

  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  const re = new RegExp('(' + escaped + ')', 'gi');

  return escHtml(text).replace(
    re,
    '<mark style="background:rgba(56,189,248,.25);color:var(--accent);border-radius:2px;">$1</mark>'
  );
}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function applyFilters(){
  const q=searchQ.toLowerCase().trim();
  filtered=REPORTS.filter(r=>{
    const mT=activeType==='all'||r.type===activeType;
    const mL=!activeLocation||r.location.trim()===activeLocation;
    const mQ=!q||r.name.toLowerCase().includes(q)||r.description.toLowerCase().includes(q)||r.location.toLowerCase().includes(q)||r.type.toLowerCase().includes(q)||(r.endUserSummary||'').toLowerCase().includes(q)||(r.aiDescription||'').toLowerCase().includes(q);
    return mT&&mL&&mQ;
  });
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('grid');
  document.getElementById('resultCount').textContent=filtered.length;
  document.getElementById('showingCount').textContent=filtered.length;
  document.getElementById('totalCount').textContent=REPORTS.length;
  if(!filtered.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">&#9678;</div><h3>No reports found</h3><p>Try a different search term or filter</p></div>';
    return;
  }
  grid.innerHTML=filtered.map((r,i)=>`
    <div class="card" style="animation-delay:${Math.min(i*0.03,0.6)}s" onclick="openModal(${REPORTS.indexOf(r)})">
      <div class="card-header">
        <div class="card-name">${highlight(r.name,searchQ)}</div>
        <span class="type-badge ${typeClass(r.type)}">${escHtml(r.type)}</span>
      </div>
      <div class="card-desc">${highlight(r.description,searchQ)}</div>
      <div class="card-meta">
        <div class="meta-row"><span class="meta-label">Location</span><span class="meta-value">${highlight(r.location,searchQ)}</span></div>
      </div>
      <div class="card-footer"><span class="view-btn">View details &rarr;</span></div>
    </div>`).join('');
}

function openModal(idx){
  const r=REPORTS[idx];
  document.getElementById('modalName').textContent=r.name;
  document.getElementById('modalDesc').textContent=r.description;
  document.getElementById('modalBadges').innerHTML=`<span class="type-badge ${typeClass(r.type)}">${escHtml(r.type)}</span>`;
  const fields=[
    {label:'Col A — OneStream Name',value:r.name},
    {label:'Col B — Report Description',value:r.description},
    {label:'Col C — Cube Views Location',value:r.location},
    {label:'Col D — Type of Report',value:r.type},
    {label:'Col G — End User Summary',value:r.endUserSummary||''},
    {label:'Col H — AI Report Description',value:r.aiDescription||''},
  ];
  document.getElementById('modalFields').innerHTML=fields.map(f=>`
    <div class="field-row">
      <div class="field-label">${escHtml(f.label)}</div>
      <div class="field-value ${!f.value.trim()?'empty':''}">${f.value.trim()?escHtml(f.value):'Not available'}</div>
    </div>`).join('');
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('searchInput').addEventListener('input',e=>{searchQ=e.target.value;applyFilters();});
document.getElementById('locationFilter').addEventListener('change',e=>{activeLocation=e.target.value;applyFilters();});
document.querySelectorAll('[data-type]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-type]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeType=btn.dataset.type;
    applyFilters();
  });
});
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

applyFilters();
</script>
</body>
